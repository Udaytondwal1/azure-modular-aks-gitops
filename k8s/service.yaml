apiVersion: v1
kind: Service
metadata:
  name: order-api-service
  labels:
    app: order-api
spec:
  type: LoadBalancer          # Azure creates a public IP automatically
  selector:
    app: order-api            # Routes traffic to pods with this label
  ports:
  - protocol: TCP
    port: 80                  # External port users hit
    targetPort: 8000          # Internal container port